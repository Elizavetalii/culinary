<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Страница не найдена</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #f6f7fb;
      color: #0f172a;
      font-family: Inter, Manrope, system-ui, sans-serif;
    }
    .error-card {
      width: min(92vw, 560px);
      border: 1px solid #e5e7eb;
      border-radius: 18px;
      background: #fff;
      box-shadow: 0 18px 48px rgba(15, 23, 42, .1);
      padding: 32px;
    }
    .error-code {
      font-size: 64px;
      line-height: 1;
      font-weight: 800;
      color: #2563eb;
    }
  </style>
</head>
<body>
  <main class="error-card">
    <div class="error-code">404</div>
    <h1 class="h4 mt-3">Страница не найдена</h1>
    <p class="text-muted mb-4">Похоже, ссылка устарела или адрес введён с ошибкой.</p>
    <div class="d-flex gap-2 flex-wrap">
      <a class="btn btn-primary" href="/dashboard/">В кабинет</a>
      <a class="btn btn-outline-secondary" href="/clients/">К клиентам</a>
    </div>
  </main>
</body>
</html>
