{% extends "portal/base_portal.html" %}
{% block title %}{{ title }}{% endblock %}
{% block content %}
<h3 class="mb-3">{{ title }}</h3>
<form method="post" class="card card-body shadow-sm" data-portal-client-form>
  {% csrf_token %}
  {{ form.non_field_errors }}
  {% for field in form %}
    <div class="mb-3">
      <label class="form-label">{{ field.label }}</label>
      {{ field }}
      {% if field.errors %}<div class="text-danger small">{{ field.errors|join:", " }}</div>{% endif %}
    </div>
  {% endfor %}
  <button class="btn btn-primary">Сохранить</button>
</form>
<script>
  (function() {
    const form = document.querySelector("[data-portal-client-form]");
    if (!form || !form.elements.phone) return;

    const phone = form.elements.phone;
    const onlyDigits = (value) => (value || "").replace(/\D/g, "");
    const normalizePhoneDigits = (value) => {
      let digits = onlyDigits(value);
      if (digits.length === 11 && digits[0] === "8") {
        digits = "7" + digits.slice(1);
      } else if (digits.length === 10) {
        digits = "7" + digits;
      }
      return digits;
    };
    const formatPhone = (value) => {
      const normalized = normalizePhoneDigits(value).slice(0, 11);
      let local = normalized;
      if (local[0] === "7") local = local.slice(1);

      const p1 = local.slice(0, 3);
      const p2 = local.slice(3, 6);
      const p3 = local.slice(6, 8);
      const p4 = local.slice(8, 10);
      let result = "+7";
      if (p1) result += " (" + p1;
      if (p1.length === 3) result += ")";
      if (p2) result += " " + p2;
      if (p3) result += "-" + p3;
      if (p4) result += "-" + p4;
      return result;
    };

    phone.addEventListener("input", () => {
      phone.value = formatPhone(phone.value);
    });
    phone.addEventListener("blur", () => {
      if (phone.value.trim()) {
        phone.value = formatPhone(phone.value);
      }
    });
    form.addEventListener("submit", () => {
      if (phone.value.trim()) {
        phone.value = "+" + normalizePhoneDigits(phone.value);
      }
    });
  })();
</script>
{% endblock %}
